name: Sync do template base

on:
  workflow_dispatch:

jobs:
  smart-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TEMPLATE_SYNC_PAT }}
          fetch-depth: 0

      - name: Fetch template
        run: |
          git remote add template https://x-access-token:${{ secrets.TEMPLATE_SYNC_PAT }}@github.com/tiagoanoliveira/barbearia-template.git || true
          git fetch template main

      - name: Aplicar alterações (excluindo rejeições)
        id: apply_diff
        run: python3 .github/scripts/smart-sync.py

      - name: Criar PR
        if: steps.apply_diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.TEMPLATE_SYNC_PAT }}
          title: "⬆️ Sync do template base — ${{ steps.apply_diff.outputs.summary }}"
          body: |
            ${{ steps.apply_diff.outputs.pr_body }}

            ---
            ## Como usar este PR

            - ✅ **Aceitar tudo**: faz merge normalmente
            - 🚫 **Rejeitar um ficheiro inteiro**: comenta no PR:
              `/reject src/components/Header.tsx Motivo aqui`
            - 🚫 **Rejeitar linhas específicas**: no diff do PR clica na linha e comenta:
              `/reject-lines Motivo aqui`

            As rejeições são guardadas em `.github/sync-rejected.json` e não voltarão a aparecer.
          branch: template-sync-${{ github.run_id }}
          labels: template-sync
          delete-branch: true

      - name: Sem alterações
        if: steps.apply_diff.outputs.has_changes == 'false'
        run: echo "✅ Nenhuma alteração nova para sincronizar."
