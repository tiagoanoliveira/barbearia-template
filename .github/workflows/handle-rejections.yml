name: Processar rejeições do sync

on:
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]

jobs:
  process-rejection:
    if: |
      contains(github.event.comment.body, '/reject') &&
      (github.event.issue.pull_request != null || github.event.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: read

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.TEMPLATE_SYNC_PAT }}
          fetch-depth: 0

      - name: Atualizar sync-rejected.json com base em todos os comentários do PR
        id: update_rejections
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TEMPLATE_SYNC_PAT }}
          script: |
            const fs = require('fs');

            let prNumber;
            if (context.eventName === 'pull_request_review_comment') {
              prNumber = context.payload.pull_request.number;
            } else {
              prNumber = context.payload.issue.number;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const labels = pr.data.labels.map(l => l.name);
            if (!labels.includes('template-sync')) {
              core.info('PR sem label template-sync, a ignorar.');
              core.setOutput('changed', 'false');
              return;
            }

            const rejectedPath = '.github/sync-rejected.json';
            let rejected = {};
            if (fs.existsSync(rejectedPath)) {
              rejected = JSON.parse(fs.readFileSync(rejectedPath, 'utf8'));
            }

            // ─ 1. Review comments (/reject-file ou /reject-lines) ──────────────────────
            const reviewComments = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });

            for (const c of reviewComments.data) {
              const body = c.body.trim();

              // /reject ficheiro [motivo]
              const rejectFileMatch = body.match(/^\/reject\s+([\w\/\.\-]+)(?:\s+(.+))?$/m);
              // /reject-lines [motivo]
              const rejectLinesMatch = body.match(/^\/reject-lines(?:\s+(.+))?$/m);

              if (rejectFileMatch) {
                const filepath = rejectFileMatch[1];
                const reason   = rejectFileMatch[2] || 'Rejeitado manualmente';
                rejected[filepath] = {
                  reason,
                  rejected_at: new Date().toISOString(),
                  rejected_hunks: []
                };
                core.info(`/reject-file: ${filepath}`);
              }

              if (rejectLinesMatch) {
                const reason   = rejectLinesMatch[1] || 'Rejeitado manualmente';
                const filepath = c.path;
                const diffHunk = c.diff_hunk;
                if (!filepath || !diffHunk) continue;

                // ── CORRECÇÃO PRINCIPAL ────────────────────────────────────────
                // Guardar cada linha "+" individualmente em vez de concatenar
                // num pattern único. O smart-sync.py compara linha-a-linha.
                const addedLines = diffHunk
                  .split('\n')
                  .filter(l => l.startsWith('+') && !l.startsWith('++'))
                  .map(l => l.substring(1).trim())
                  .filter(l => l.length > 0);

                if (addedLines.length === 0) continue;

                if (!rejected[filepath]) {
                  rejected[filepath] = { reason: '', rejected_hunks: [] };
                }

                // Evitar duplicados: verifica se alguma linha já existe
                const existingLines = new Set(
                  rejected[filepath].rejected_hunks.flatMap(h => h.lines || [])
                );
                const newLines = addedLines.filter(l => !existingLines.has(l));

                if (newLines.length > 0) {
                  rejected[filepath].rejected_hunks.push({
                    id: `reject-${Date.now()}-${Math.random().toString(16).slice(2)}`,
                    lines: newLines,          // ← lista de linhas (novo formato)
                    note: reason,
                    rejected_at: new Date().toISOString()
                  });
                  core.info(`/reject-lines: ${filepath} — ${newLines.length} linha(s)`);
                }
              }
            }

            // ─ 2. Issue comments (/reject ficheiro) ─────────────────────────────
            const issueComments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });

            for (const c of issueComments.data) {
              const body = c.body.trim();
              const rejectFileMatch = body.match(/^\/reject\s+([\w\/\.\-]+)(?:\s+(.+))?$/m);
              if (rejectFileMatch) {
                const filepath = rejectFileMatch[1];
                const reason   = rejectFileMatch[2] || 'Rejeitado manualmente';
                rejected[filepath] = {
                  reason,
                  rejected_at: new Date().toISOString(),
                  rejected_hunks: []
                };
              }
            }

            fs.mkdirSync('.github', { recursive: true });
            fs.writeFileSync(rejectedPath, JSON.stringify(rejected, null, 2));

            core.setOutput('changed', 'true');
            core.setOutput('pr_number', prNumber.toString());

      - name: Commit e push do sync-rejected.json no main
        if: steps.update_rejections.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/sync-rejected.json
          git diff --staged --quiet || git commit -m "chore: atualizar sync-rejected a partir de comentários do PR #${{ steps.update_rejections.outputs.pr_number }} [skip ci]"
          git push

      - name: Comentar no PR a confirmar
        if: steps.update_rejections.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TEMPLATE_SYNC_PAT }}
          script: |
            const prNumber = parseInt('${{ steps.update_rejections.outputs.pr_number }}');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '\u2705 Rejeições registadas em `.github/sync-rejected.json` no `main`.\n\nFecha este PR e volta a correr o workflow de sync — o próximo PR já vai ignorar estes blocos/ficheiros.'
            });
