<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon / App icon (substituído por Vite com o logo real) -->
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/logo-96px.webp" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/logo-192px.webp" />

    <!-- SEO -->
    <title>Brooklyn Barbearia</title>
    <meta name="description" content="Barbearia premium no Porto. Reserva online rápida e fácil." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Brooklyn Barbearia" />
    <meta property="og:description" content="Barbearia premium no Porto. Reserva online rápida e fácil." />
    <meta property="og:image" content="/icons/logo-192px.webp" />

    <!-- Theme / PWA base -->
    <meta name="theme-color" content="#052e16" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Brooklyn" />
    <link rel="apple-touch-icon" href="/icons/logo-192px.webp" />

    <!--
      PWA manifest é injetado dinamicamente pelo service-worker-registration.ts
      consoante a URL de instalação (/admin vs público).
      O <link rel="manifest"> é adicionado via JS antes do registo do SW.
    -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Google tag (gtag.js) -->
    <script>
      window.addEventListener('load', function() {
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-1KPLF01QLJ';
        s.async = true;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-1KPLF01QLJ');
      });
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "name": "Brooklyn Barbearia",
        "url": "https://brooklynbarbearia.pt",
        "telephone": "+351224938542",
        "email": "geral@brooklynbarbearia.pt",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Rua do Campo Alegre, 450",
          "addressLocality": "Porto",
          "addressCountry": "PT"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
            "opens": "10:00",
            "closes": "20:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "09:00",
            "closes": "18:00"
          }
        ],
        "sameAs": ["https://instagram.com/brooklynbarbeariapt"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
